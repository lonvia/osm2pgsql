  ubuntu20-pg13-gcc10-release-nolua:
    runs-on: ubuntu-20.04
    if: False

    env:
      CC: gcc-10
      CXX: g++-10
      POSTGRESQL_VERSION: 13
      POSTGIS_VERSION: 2.5
      CPP_VERSION: 17
      BUILD_TYPE: Release

    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/ubuntu-prerequisites
      - uses: ./.github/actions/build-and-test

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}

    env:
      GETOPT_INCLUDE_DIR: ${{ github.workspace }}/../wingetopt/src
      GETOPT_LIBRARY: ${{ github.workspace }}/../wingetopt/build/Release/wingetopt.lib
      VCPKG_DEFAULT_BINARY_CACHE: C:/vcpkg_binary_cache

    steps:
      - uses: actions/checkout@v2
      - name: Download osm2pgsql
        run: (new-object net.webclient).DownloadFile("https://osm2pgsql.org/download/windows/osm2pgsql-latest-x64.zip", "osm2pgsql.zip")
      - name: Prepare
        run: |
          unzip osm2pgsql.zip
          mv osm2pgsql-bin build
      - name: Run behave
        run: behave
        shell: bash
        working-directory: tests/bdd/

  windows-package:
    needs: windows
    runs-on: windows-2022
    if: False

    env:
      OSMURL: https://download.geofabrik.de/europe/monaco-latest.osm.bz2

    steps:
      - uses: actions/checkout@v2
      - uses: actions/cache@v2
        with:
          path: |
            C:/postgis.zip
          key: postgis-cache
      - name: Install psycopg2 and beahve
        run: python -m pip install psycopg2 behave
        shell: bash
      - uses: actions/download-artifact@v2
        with:
          name: osm2pgsql-win64
      - uses: ./.github/actions/win-postgres
      - name: Set up database
        run: |
          & $env:PGBIN\createdb osm
          & $env:PGBIN\psql -d osm -c "CREATE EXTENSION hstore; CREATE EXTENSION postgis;"
        shell: pwsh
      - name: Get test data
        run: (new-object net.webclient).DownloadFile($env:OSMURL, "testfile.osm.bz2")
      - name: Execute osm2pgsql
        run: ./osm2pgsql-bin/osm2pgsql --slim -d osm testfile.osm.bz2
        shell: bash

